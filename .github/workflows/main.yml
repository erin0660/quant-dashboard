name: Daily Quant Report

# 設定鬧鐘時間與手動開關
on:
  schedule:
    - cron: '0 0 * * *' # UTC 時間 00:00 (台灣時間早上 08:00) 自動執行
  workflow_dispatch: # 允許我們隨時手動點擊按鈕執行

jobs:
  build:
    runs-on: ubuntu-latest # 給機器人一台虛擬的 Linux 電腦

    steps:
    - name: 取得程式碼
      uses: actions/checkout@v3

    - name: 安裝 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安裝必備套件
      run: |
        python -m pip install --upgrade pip
        pip install requests jinja2

    - name: 執行量化報表程式
      run: python test.py

    - name: 將產出的 index.html 存回 GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add index.html
        git commit -m "Auto-generate daily report" || echo "No changes to commit"
        git push
