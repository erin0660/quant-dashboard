<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro 專業量化交易日報</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #3b82f6;
            margin: 0;
            font-size: 24px;
        }
        .update-time {
            color: #888;
            font-size: 14px;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: #1e1e24;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid #2b2b36;
        }
        .card h2 {
            font-size: 16px;
            color: #fff;
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .label { color: #aaa; }
        .value { font-weight: bold; color: #fff; }
        .highlight-green { color: #4ade80; }
        
        /* 表格樣式 */
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }
        th {
            color: #888;
            padding: 8px 0;
            border-bottom: 1px solid #333;
            font-weight: normal;
        }
        td {
            padding: 10px 0;
            border-bottom: 1px solid #222;
        }
        .rank { color: #888; }
        .symbol { font-weight: bold; color: #fff; }
        .price { color: #ddd; }
    </style>
</head>
<body>

    <div class="header">
        <h1>📊 Pro 專業量化交易日報</h1>
        <div class="update-time">資料時間: 2026-06-08 14:26:10 (GMT+8)</div>
    </div>

    <div class="dashboard-grid">
        
        <!-- 核心資產區塊 -->
        <div class="card">
            <h2>🪙 核心資產報價與資金費率</h2>
            <div class="data-row"><span class="label">BTC 現價</span><span class="value">$62,976</span></div>
            <div class="data-row"><span class="label">BTC 資金費率</span><span class="value highlight-green">N/A</span></div>
            <br>
            <div class="data-row"><span class="label">ETH 現價</span><span class="value">$1,665.48</span></div>
            <div class="data-row"><span class="label">ETH 資金費率</span><span class="value highlight-green">N/A</span></div>
        </div>

        <!-- 異動排名區塊 (動態生成) -->
        <div class="card">
            <h2 style="color: #4ade80;">🚀 24H 強勢幣種異動排名</h2>
            <table>
                <thead>
                    <tr>
                        <th>排名</th>
                        <th>幣種</th>
                        <th>最新價格</th>
                        <th style="text-align: right;">24H 漲幅</th>
                    </tr>
                </thead>
                <tbody>
                    
                </tbody>
            </table>
        </div>

        <!-- 總體經濟與情緒區塊 -->
        <div class="card">
            <h2>🌍 總體經濟與情緒</h2>
            <div class="data-row"><span class="label">恐懼貪婪指數</span><span class="value">8 (Extreme Fear)</span></div>
            <div class="data-row"><span class="label">美元指數 (DXY)</span><span class="value">104.25</span></div>
            <div class="data-row"><span class="label">黃金現貨</span><span class="value">$2,350.10</span></div>
        </div>

        <!-- 穩定幣數據區塊 -->
        <div class="card">
            <h2>💵 穩定幣數據</h2>
            <div class="data-row"><span class="label">USDT 市值</span><span class="value">$110.5B</span></div>
            <div class="data-row"><span class="label">USDC 市值</span><span class="value">$32.1B</span></div>
        </div>

    </div>

</body>
</html>
